name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  action:
    name: GitHub Actions
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.test-action.outputs.files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files-ts
        with:
          files: "src/**/*.ts"

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          files: ${{ steps.changed-files-ts.outputs.all_changed_files }}
          matrix: true
    
  action-max-depth:
    name: GitHub Actions Max Depth
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.test-action.outputs.files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files-ts
        with:
          files: "src/**/*.ts"

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          dir_names: true
          dir_names_max_depth: 1
          files: ${{ steps.changed-files-ts.outputs.all_changed_files }}
          matrix: true

  hello:
    name: Hello
    runs-on: ubuntu-latest
    needs:
      - action
    strategy:
      matrix:
        path: ${{ fromJson(needs.action.outputs.files) }}

    steps:
      - name: Test
        run: echo "Hello, World from ${{ matrix.path }}"

  hello-max-depth:
    name: Hello Max Depth
    runs-on: ubuntu-latest
    needs:
      - action-max-depth
    strategy:
      matrix:
        path: ${{ fromJson(needs.action-max-depth.outputs.files) }}

    steps:
      - name: Test
        run: echo "Hello, World from ${{ matrix.path }}"

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run ci-test
